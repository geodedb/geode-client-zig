name: Build

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  deployments: write
  packages: write
  pages: write

env:
  GOPRIVATE: ${{ vars.GOPRIVATE }}
  GH_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Build
        run: zig build -Doptimize=ReleaseSmall -Dstrip
      - name: Unit tests
        env:
          UA_PERF_HARNESS_ENABLE: '0'
        run: zig build test
      - name: Doccheck (public API docs)
        run: zig run tools/doccheck.zig
      - name: GAP doc present
        run: test -f docs/GAP_ANALYSIS.md

  accept-quic:
    name: Acceptance QUIC handshake
    runs-on: ubuntu-latest
    strategy:
      matrix:
        enable_quic_stub: [true, false]
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Build acceptance
        run: zig build -Daccept=true -Doptimize=ReleaseSmall -Dstrip -Denable_quic_stub=${{ matrix.enable_quic_stub }}
      - name: Run acceptance handshake
        id: run
        run: |
          set -e
          if [ "${{ matrix.enable_quic_stub }}" = "true" ]; then
            OUT=$(zig build test -Daccept=true -Denable_quic_stub=true -- TestAcceptance_QuicV2Handshake)
            echo "$OUT" > out.txt
            echo "$OUT"
            test "$OUT" = '{"ts":"2025-01-01T00:00:00Z","level":"INFO","event":"QUIC_HANDSHAKE_OK","version":"v2","alpn":"ua/1","zero_rtt":false}'
          else
            OUT=$(zig build test -Daccept=true -Denable_quic_stub=false -- TestAcceptance_QuicV2Handshake)
            echo "$OUT" > out.txt
            echo "$OUT"
            test "$OUT" = '{"level":"INFO","event":"TRANSPORT_DISABLED"}'
          fi

  windows-smoke:
    name: Windows build + tests (smoke)
    runs-on: windows-latest
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Build
        run: zig build -Doptimize=ReleaseSmall -Dstrip
      - name: Unit tests (smoke)
        env:
          UA_PERF_HARNESS_ENABLE: '0'
        run: zig build test

  macos-smoke:
    name: macOS build + tests (smoke)
    runs-on: macos-14
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Build
        run: zig build -Doptimize=ReleaseSmall -Dstrip
      - name: Unit tests (smoke)
        env:
          UA_PERF_HARNESS_ENABLE: '0'
        run: zig build test
