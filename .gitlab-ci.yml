# =============================================================================
# Geode Zig Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components for standardized, organization-wide CI
# =============================================================================
#
# Pipeline stages:
#   1. lint     - Code formatting checks
#   2. build    - Compile the library
#   3. test     - Unit tests and fuzz tests
#   4. integration - Integration tests with Geode server
#
# Environment variables:
#   ZIG_VERSION     - Override Zig version (default: 0.14.0)
#   SKIP_INTEGRATION - Set to "true" to skip integration tests
#
# =============================================================================

variables:
  # Use 0.14.0 as it's the latest stable version available from ziglang.org
  ZIG_VERSION: "0.14.0"
  GEODE_IMAGE: "registry.gitlab.com/devnw/geode/geode:latest"

stages:
  - lint
  - build
  - test
  - integration

# =============================================================================
# Include CI/CD Catalog Components
# =============================================================================

include:
  # Format check for all Zig source files
  # Note: Component inputs require literal values, not CI variables
  - component: gitlab.com/devnw/ci-catalog/zig-format@latest
    inputs:
      zig_version: "0.14.0"
      paths: "*.zig src/*.zig tests/*.zig benchmarks/*.zig fuzz/*.zig"
      stage: lint
      allow_failure: true  # Format may differ between Zig versions

  # Build the library
  - component: gitlab.com/devnw/ci-catalog/zig-build@latest
    inputs:
      zig_version: "0.14.0"
      stage: build
      extra_packages: "libssl-dev"
      artifact_paths: "zig-out/"
      artifact_expire: "1 day"

  # Run unit tests with coverage
  - component: gitlab.com/devnw/ci-catalog/zig-test@latest
    inputs:
      zig_version: "0.14.0"
      stage: test
      extra_packages: "libssl-dev bc"
      test_options: "--summary all"
      coverage: true

  # Run fuzz/property-based tests
  - component: gitlab.com/devnw/ci-catalog/zig-fuzz@latest
    inputs:
      zig_version: "0.14.0"
      stage: test
      test_step: "test-fuzz"
      extra_packages: "libssl-dev"
      timeout: "15m"

# =============================================================================
# Integration Stage - Docker-based Integration Tests
# =============================================================================
# Note: Integration tests are defined inline because they require custom rules
# and service configuration that varies per project.

integration-tests:
  stage: integration
  image: "ubuntu:24.04"
  variables:
    ZIG_VERSION: $ZIG_VERSION
    SERVICE_PORT: "3141"
    STARTUP_TIMEOUT: "60"
  services:
    - name: $GEODE_IMAGE
      alias: geode
      command:
        - serve
        - --listen
        - "0.0.0.0:3141"
        - --log-level
        - info
  cache:
    key: "linux-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils netcat-openbsd libssl-dev
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-linux-x86_64-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
    # Wait for Geode service to be ready
    - |
      echo "Waiting for Geode service to be ready (timeout: ${STARTUP_TIMEOUT}s)..."
      ELAPSED=0
      while [ $ELAPSED -lt $STARTUP_TIMEOUT ]; do
        # For UDP, we just wait and hope - nc -u doesn't work well for checking
        sleep 1
        ELAPSED=$((ELAPSED + 1))
        if [ $((ELAPSED % 10)) -eq 0 ]; then
          echo "  Still waiting... (${ELAPSED}s/${STARTUP_TIMEOUT}s)"
        fi
      done
      echo "Service should be ready"
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - export GEODE_SERVER="geode:${SERVICE_PORT}"
    - export GEODE_INSECURE=1
    - |
      echo "Running integration tests..."
      echo "  Server: $GEODE_SERVER"
      zig build test-integration --summary all 2>&1 | tee integration-test-output.txt
      echo "Integration tests completed"
  artifacts:
    paths:
      - integration-test-output.txt
    expire_in: 1 week
    when: always
  rules:
    - if: $SKIP_INTEGRATION == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# Optional: Manual Release Build
# =============================================================================

release-build:
  stage: build
  image: "ubuntu:24.04"
  variables:
    ZIG_VERSION: $ZIG_VERSION
  cache:
    key: "linux-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils libssl-dev
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-linux-x86_64-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build -Doptimize=ReleaseSafe
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
