# =============================================================================
# Geode Zig Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================

include:
  - component: gitlab.com/devnw/ci-catalog/zig-format@latest
    inputs:
      zig_version: "0.15.2"
      paths: "*.zig"
      stage: lint
      allow_failure: true

  - component: gitlab.com/devnw/ci-catalog/zig-build@latest
    inputs:
      zig_version: "0.15.2"
      stage: build

  - component: gitlab.com/devnw/ci-catalog/zig-test@latest
    inputs:
      zig_version: "0.15.2"
      stage: test
      allow_failure: true  # Tests may require running Geode server

stages:
  - lint
  - build
  - test
