# =============================================================================
# Geode Zig Client CI/CD Pipeline
# =============================================================================
#
# Dependencies are resolved via build.zig.zon git URLs (no manual cloning).
#
# Pipeline stages:
#   0. prepare  - Cached Zig toolchain
#   1. lint     - Code formatting checks
#   2. build    - Compile the library
#   3. test     - Unit tests and fuzz tests
#   4. integration - Integration tests with Geode server
#   5. security - Standalone secret scanning
#   6. sbom     - SBOM generation and scanning
#   7. release  - Semantic release
#
# Environment variables:
#   ZIG_VERSION     - Override Zig version (default: 0.16.0)
#   SKIP_INTEGRATION - Set to "true" to skip integration tests
#
# =============================================================================

variables:
  ZIG_VERSION: "0.16.0"
  ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.zig-global-cache"
  ZIG_TARBALL_SHA256_X86_64: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
  GEODE_IMAGE: "geodedb/geode:0.8.22@sha256:867d93375470fd18c60336036196a9ef9715a1922e063e8787dc05d8e798ddce"

default:
  interruptible: true
  tags:
    - company
    - linux

stages:
  - prepare
  - lint
  - build
  - test
  - integration
  - security
  - sbom
  - release

# =============================================================================
# Lint Stage - Format check using CI catalog component
# =============================================================================

include:
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@402e8986ef2d220db1c2591a461ba60850c59e5b
    inputs:
      tags: [dedicated, macos, arm]
      zig_version: "0.16.0"
      job_suffix: "-portable-deps"
      test_step: test
      test_options: "-j2 --summary all"
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"
      paths: "*.zig src/*.zig tests/*.zig benchmarks/*.zig fuzz/*.zig"
      stage: lint

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724

  # SBOM generation and scanning
  # allow_failure: external syft download may fail due to DNS/network issues
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      release_auth: job_token
      stage: release

# SBOM jobs may fail due to DNS/network issues downloading syft
sbom-generate:
  allow_failure: true

sbom-scan:
  allow_failure: true

# =============================================================================
# Common setup template for Zig jobs
# =============================================================================

.setup-zig:
  # The installer selects the x86_64 Zig archive.
  tags: [company, linux, x86]
  image: "ubuntu:26.04"
  variables:
    ZIG_VERSION: "0.16.0"
  cache:
    - key: "zig-toolchain-${ZIG_VERSION}-linux-amd64-verified"
      paths: ["zig-${ZIG_VERSION}/"]
      policy: pull
    - key:
        prefix: "zig-compile-${ZIG_VERSION}-linux-amd64-${CI_JOB_NAME}"
        files: [build.zig.zon, .gitlab-ci.yml]
      paths: [.zig-cache/, .zig-global-cache/]
  after_script: &trim-zig-cache
    - |
      size=$(du -sm .zig-cache .zig-global-cache 2>/dev/null | awk '{sum += $1} END {print sum+0}')
      if [ "$size" -gt 2048 ]; then rm -rf .zig-cache .zig-global-cache; fi
  before_script:
    - set -o pipefail
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates xz-utils git libssl-dev
    # Install the checksum-verified Zig toolchain, reused across jobs
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        MAJOR=$(echo $ZIG_VERSION | cut -d. -f1)
        MINOR=$(echo $ZIG_VERSION | cut -d. -f2)
        if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
          ARCHIVE_NAME="zig-linux-x86_64-${ZIG_VERSION}"
        else
          ARCHIVE_NAME="zig-x86_64-linux-${ZIG_VERSION}"
        fi
        TARBALL="${ARCHIVE_NAME}.tar.xz"
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "$TARBALL"
        echo "${ZIG_TARBALL_SHA256_X86_64}  ${TARBALL}" | sha256sum --check --strict
        tar -xJf "$TARBALL"
        mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
        rm -f "$TARBALL"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version

# =============================================================================
# Build Stage
# =============================================================================

# A single writer fills the toolchain cache; the build/test jobs only restore it.
prepare-zig:
  extends: .setup-zig
  stage: prepare
  script:
    - zig version
  cache:
    key: "zig-toolchain-${ZIG_VERSION}-linux-amd64-verified"
    paths: ["zig-${ZIG_VERSION}/"]
    policy: pull-push
  after_script: []

zig-format:
  cache:
    key: "zig-toolchain-${ZIG_VERSION}-linux-amd64-verified"
    paths: ["zig-${ZIG_VERSION}/"]
    policy: pull

build:
  extends: .setup-zig
  stage: build
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

# =============================================================================
# Test Stage
# =============================================================================

test:
  extends: .setup-zig
  stage: test
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test --summary all 2>&1 | tee test-output.txt
  artifacts:
    paths:
      - test-output.txt
    expire_in: 1 week
    when: always

test-fuzz:
  extends: .setup-zig
  stage: test
  timeout: 15m
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test-fuzz 2>&1 | tee fuzz-test-output.txt
  artifacts:
    paths:
      - fuzz-test-output.txt
    expire_in: 1 week
    when: always

# =============================================================================
# Integration Stage - Docker-based Integration Tests
# =============================================================================

integration-tests:
  extends: .setup-zig
  stage: integration
  variables:
    SERVICE_PORT: "3141"
    STARTUP_TIMEOUT: "60"
    # Disposable service: authenticated tests use the same bootstrap account.
    GEODE_ADMIN_USERNAME: "geode"
    GEODE_USERNAME: "geode"
    GEODE_PASSWORD: "Correct horse battery staple" # gitleaks:allow
    GEODE_ADMIN_PASSWORD: "$GEODE_PASSWORD"
    GEODE_DEFAULT_PASSWORD: "$GEODE_PASSWORD"
    GEODE_METRICS_PORT: "9090"
    GEODE_METRICS_BIND: "0.0.0.0"
    HEALTHCHECK_TCP_PORT: "9090"
  services:
    - name: $GEODE_IMAGE
      alias: geode
      command:
        - serve
        - --listen
        - "0.0.0.0:3141"
        - --log-level
        - info
        - --data-dir
        - /data
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - |
      echo "Waiting for Geode service to be ready (timeout: ${STARTUP_TIMEOUT}s)..."
      ELAPSED=0
      while [ $ELAPSED -lt $STARTUP_TIMEOUT ]; do
        if curl -fsS --max-time 2 "http://geode:${GEODE_METRICS_PORT}/health" >/dev/null 2>&1; then
          echo "Geode service is ready after ${ELAPSED}s"
          break
        fi
        sleep 1
        ELAPSED=$((ELAPSED + 1))
        if [ $((ELAPSED % 10)) -eq 0 ]; then
          echo "  Still waiting... (${ELAPSED}s/${STARTUP_TIMEOUT}s)"
        fi
      done
      if [ $ELAPSED -ge $STARTUP_TIMEOUT ]; then
        echo "ERROR: Geode service did not become ready within ${STARTUP_TIMEOUT}s"
        exit 1
      fi
    - export GEODE_SERVER="geode:${SERVICE_PORT}"
    - export GEODE_INSECURE=1
    - |
      echo "Running integration tests..."
      echo "  Server: $GEODE_SERVER"
      zig build test-integration --summary all 2>&1 | tee integration-test-output.txt
      echo "Integration tests completed"
  artifacts:
    paths:
      - integration-test-output.txt
    expire_in: 1 week
    when: always
  # SECURITY: Integration tests should block pipeline on main branch (CWE-1127)
  # Allow failure on merge requests where service may not be accessible
  rules:
    - if: $SKIP_INTEGRATION == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true  # Allow failure until Geode Docker image is published
    - if: $CI_COMMIT_BRANCH
      allow_failure: true

# =============================================================================
# SBOM: Zig Dependency Report
# =============================================================================

# SECURITY: Generate SBOM for Zig dependencies (Issue #24)
# Standard SBOM tools don't recognize build.zig.zon, so we use a custom script
zig-dependency-sbom:
  stage: sbom
  needs: []
  image: alpine:latest
  before_script:
    - apk add --no-cache bash grep gawk
  script:
    - bash -o pipefail -c './scripts/generate-zig-sbom.sh build.zig.zon | tee zig-dependencies.txt'
  artifacts:
    paths:
      - zig-dependencies.txt
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH

# =============================================================================
# Optional: Manual Release Build
# =============================================================================

release-build:
  extends: .setup-zig
  stage: build
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build -Doptimize=ReleaseSafe
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    # Handwritten jobs use branch pipelines; avoid partial MR duplicates.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

# Full unit coverage includes the backend entropy/signature regression.
zig-test-macos-portable-deps-0.16.0:
  needs: []
  variables:
    ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.zig-global-cache"
  cache:
    key:
      prefix: "zig-macos-0.16.0-aarch64"
      files: [build.zig.zon, .gitlab-ci.yml]
    paths: [zig-0.16.0/, .zig-global-cache/, .zig-cache/]
  after_script: *trim-zig-cache
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
