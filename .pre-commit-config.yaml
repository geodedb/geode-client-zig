# Pre-commit configuration for Geode Zig Client
# https://pre-commit.com/
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

default_stages: [pre-commit]
fail_fast: false

repos:
  # =============================================================================
  # Standard pre-commit hooks (best practices)
  # =============================================================================
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
      # Formatting
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
    exclude: ^(vendor/|zig-out/|\.zig-cache/)
  - id: end-of-file-fixer
    exclude: ^(vendor/|zig-out/|\.zig-cache/|.*\.bin$|.*\.der$|.*\.pem$)
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: ^(vendor/|zig-out/)

      # Syntax validation
  - id: check-yaml
    args: [--unsafe]      # Allow custom tags
    exclude: ^(vendor/)
  - id: check-json
    exclude: ^(vendor/|zig-out/)
  - id: check-toml

      # Security
  - id: detect-private-key
    exclude: ^(certs/|test.*certs/|.*test.*\.pem$|vendor/)
  - id: check-added-large-files
    args: [--maxkb=1024]
    exclude: ^(vendor/)

      # Git hygiene
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-symlinks
  - id: destroyed-symlinks

      # Code quality
  - id: check-executables-have-shebangs
    exclude: ^(vendor/|zig-out/)
  - id: check-shebang-scripts-are-executable
    exclude: ^(vendor/)

  # =============================================================================
  # Shell script linting
  # =============================================================================
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.10.0.1
  hooks:
  - id: shellcheck
    args: [--severity=warning]
    exclude: ^(vendor/)

  # =============================================================================
  # Markdown linting
  # =============================================================================
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.43.0
  hooks:
  - id: markdownlint
    args: [--fix, --disable, MD013, MD033, MD041, MD024, --]
    exclude: ^(vendor/|CHANGELOG\.md)

  # =============================================================================
  # YAML formatting
  # =============================================================================
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^(vendor/|\.gitlab-ci\.yml|docker-compose.*\.yml)

  # =============================================================================
  # Commit message validation (Conventional Commits)
  # =============================================================================
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.1.0
  hooks:
  - id: commitizen
    stages: [commit-msg]

  # =============================================================================
  # Local/Custom hooks for Zig
  # =============================================================================
- repo: local
  hooks:
      # Zig formatting check
  - id: zig-fmt
    name: zig fmt (check)
    entry: zig fmt --check
    language: system
    files: \.zig$
    exclude: ^(vendor/|zig-out/|\.zig-cache/)
    pass_filenames: true

      # Zig build check (compilation)
  - id: zig-build
    name: zig build (compilation check)
    entry: zig build
    language: system
    files: \.(zig|zon)$
    exclude: ^(vendor/|zig-out/|\.zig-cache/)
    pass_filenames: false
    stages: [pre-commit]

      # Unit tests (on pre-push only - may be slow)
  - id: zig-test
    name: zig build test
    entry: zig build test
    language: system
    files: \.(zig|zon)$
    exclude: ^(vendor/|zig-out/|\.zig-cache/)
    pass_filenames: false
    stages: [pre-push]

      # Fuzz/property-based tests (on pre-push only)
  - id: zig-test-fuzz
    name: zig build test-fuzz
    entry: zig build test-fuzz
    language: system
    files: \.(zig|zon)$
    exclude: ^(vendor/|zig-out/|\.zig-cache/)
    pass_filenames: false
    stages: [pre-push]

      # Check for TODO/FIXME in committed code (warning only)
  - id: check-todos
    name: check for TODOs/FIXMEs
    entry: bash
    args:
    - -c
    - |
      git diff --cached --name-only | xargs grep -l -E "(TODO|FIXME|XXX|HACK)" 2>/dev/null && echo "Warning: Found TODO/FIXME markers in staged files" && exit 0 || exit 0
    language: system
    pass_filenames: false
    verbose: true

# =============================================================================
# CI configuration
# =============================================================================

- repo: local
  hooks:
      # Diamond-dep detector — fail loud when build.zig.zon transitively
      # pins the same package name to two different content hashes.
      # Soft-fails when the zig package cache hasn't been populated yet
      # (run `zig build --fetch` first).
  - id: detect-diamond-deps
    name: detect diamond deps in build.zig.zon
    entry: bash
    args:
    - -c
    - |
      python3 scripts/detect_diamond_deps.py
      rc=$?
      if [ $rc -eq 2 ]; then
        echo "detect-diamond-deps: cache not populated; skipping (run 'zig build --fetch')"
        exit 0
      fi
      exit $rc
    language: system
    files: ^build\.zig\.zon$
    pass_filenames: false

ci:
  autofix_prs: true
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    For more info see https://pre-commit.ci
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [zig-fmt, zig-build, zig-test, zig-test-fuzz]
  submodules: false
