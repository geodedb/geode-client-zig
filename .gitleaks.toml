#
# SECURITY: This configuration uses targeted rules instead of blanket file
# exclusions to ensure secrets in .zig and .md files are still detected.
# See GAP_ANALYSIS.md Finding 2.

title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global path allowlist for build artifacts and vendored code"
paths = [
  # Build artifacts and cache
  '''\.zig-cache''',
  '''zig-out''',
  # Vendored dependencies (may contain test vectors)
  '''vendor/.*''',
  # Test data directories
  '''testdata''',
  # Log files
  '''.*\.log$''',
]

# =============================================================================
# Targeted regex allowlists for known test patterns
# These replace the blanket .zig and .md exclusions with specific patterns
# =============================================================================

[[rules]]
id = "test-credentials-zig"
description = "Allow known test credentials in Zig test code"
regex = '''("secret"|"password123"|"token123"|"admin"|"testuser"|"newuser")'''
allowlist.paths = [
  '''tests/.*\.zig$''',
  '''src/.*\.zig$''',
  '''benchmarks/.*\.zig$''',
  '''fuzz/.*\.zig$''',
]

[[rules]]
id = "zig-struct-field-password"
description = "Allow password field declarations in Zig structs"
regex = '''password:\s*(\?\[\]const u8|\[\]const u8)'''

[[rules]]
id = "zig-struct-field-token"
description = "Allow token field declarations in Zig structs"
regex = '''(session_token|token_secret|token_expiry):\s*'''

[[rules]]
id = "dsn-example-credentials"
description = "Allow DSN examples with test credentials"
regex = '''geode://(admin|user):secret@(localhost|127\.0\.0\.1):\d+'''

[[rules]]
id = "test-expect-password"
description = "Allow test assertions containing password strings"
regex = '''expectEqualStrings\("(secret|pass=word|password123)"'''

[[rules]]
id = "json-field-password"
description = "Allow JSON password field patterns in protocol builders"
regex = '''"password":\\"'''

[[rules]]
id = "doc-example-credentials"
description = "Allow example credentials in documentation"
regex = '''(username|user)=(admin|testuser)&(password|pass)=secret'''
allowlist.paths = [
  '''.*\.md$''',
  '''CLAUDE\.md$''',
  '''README\.md$''',
]

[[rules]]
id = "config-example-credentials"
description = "Allow withCredentials examples"
regex = '''withCredentials\("admin",\s*"secret"\)'''

[[rules]]
id = "error-messages"
description = "Allow error messages mentioning credentials"
regex = '''(invalid|bad|wrong)\s+credentials'''
