#
# SECURITY: This configuration uses allowlists for known false positives
# while still detecting actual secrets. All patterns are documented with
# justification for why they are safe to ignore.

title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for false positives"
# Path-based allowlists for build artifacts
paths = [
  # Build artifacts and cache
  '''\.zig-cache''',
  '''zig-out''',
  # Vendored dependencies
  '''vendor/.*''',
  # Test data directories
  '''testdata''',
  # Log files
  '''.*\.log$''',
]

# Regex-based allowlists for false positives
# These patterns match known false positives that are not actual secrets
regexes = [
  # Zig struct field declarations (type annotations, not values)
  '''password:\s*\??(\[\]const u8|u8)''',
  '''(session_token|token_secret|token_expiry):\s*''',
  # DSN example strings in documentation/tests with test credentials
  '''(quic|grpc|geode)://(admin|user|testuser):(secret|password)@(localhost|127\.0\.0\.1|::1)''',
  # Query parameter examples with test credentials
  '''(user|username)=(admin|testuser)&(pass|password)=secret''',
  # withCredentials function calls in examples
  '''withCredentials\("(admin|testuser)",\s*"secret"\)''',
  # Test assertion patterns
  '''expectEqualStrings?\("(secret|password123?|pass=word)"''',
  # JSON field declarations (building protocol messages)
  '''"password":\s*\\"''',
  # Default test password constant
  '''GeodeTestPassword123!''',
  # Error message strings mentioning credentials
  '''(invalid|bad|wrong|missing)\s+credentials''',
]

# Stop words to reduce noise
stopwords = [
  "EXAMPLE",
  "example",
  "test",
  "TEST",
  "mock",
  "MOCK",
  "sample",
  "SAMPLE",
  "placeholder",
  "PLACEHOLDER",
  "TODO",
  "FIXME",
]
